<!DOCTYPE html><html lang='en'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1.0'><title>Register</title><link href='https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css' rel='stylesheet'><link rel='stylesheet' href='css/style.css'></head><body class='bg-light'><div class='container py-5'><div class='row justify-content-center'><div class='col-md-8'><div class='card shadow-sm'><div class='card-body p-4'><h3 class='mb-3'>Register</h3><div class='row g-3'><div class='col-md-4'><label class='form-label'>Role</label><select id='role' class='form-select'><option value='USER'>User</option><option value='DRIVER'>Driver</option></select></div><div class='col-md-4'><label class='form-label'>Name</label><input id='name' class='form-control'></div><div class='col-md-4'><label class='form-label'>Phone</label><input id='phone' class='form-control'></div><div class='col-md-6'><label class='form-label'>Email</label><input id='email' class='form-control'></div><div class='col-md-6'><label class='form-label'>Password</label><input id='password' type='password' class='form-control'></div><div class='col-md-12'><button id='registerBtn' class='btn btn-success'>Create Account</button></div></div><div id='msg' class='mt-3 small'></div><p class='mt-3 small'><a href='login.html'>Back to Login</a></p></div></div></div></div></div><script src='js/api.js'></script><script src='js/auth.js'></script></body></html>
