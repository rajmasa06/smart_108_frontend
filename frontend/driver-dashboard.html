<!DOCTYPE html><html><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1.0'><title>Driver Dashboard</title><link href='https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css' rel='stylesheet'><link rel='stylesheet' href='css/style.css'></head><body><div class='d-flex'><aside class='sidebar p-3'><h5>Smart108 Driver</h5><a href='driver-dashboard.html'>Dashboard</a><a href='tracking.html'>Tracking</a><a href='#' id='logout'>Logout</a></aside><main class='p-4 flex-grow-1'><div class='d-flex justify-content-between'><h3>Driver Operations</h3><span id='driverStatus' class='badge bg-secondary'>OFFLINE</span></div><div class='my-3 d-flex gap-2 flex-wrap'><button id='startDutyBtn' class='btn btn-success'>Start Duty</button><button id='loadAssignedBtn' class='btn btn-primary'>Load Assigned Emergencies</button><button id='liveSimBtn' class='btn btn-warning'>Start Live Tracking</button></div><div class='card p-3 mb-3'><h5>Emergency Workflow</h5><div class='row g-2'><div class='col-md-3'><input id='emergencyId' class='form-control' placeholder='Emergency ID'></div><div class='col-md-9 d-flex flex-wrap gap-2'><button class='btn btn-outline-primary' data-action='accept'>Accept</button><button class='btn btn-outline-info' data-action='scene'>At Scene</button><button class='btn btn-outline-warning' data-action='transport'>Start Transport</button><button class='btn btn-outline-success' data-action='hospital'>Reached Hospital</button><button class='btn btn-outline-dark' data-action='complete'>Complete</button></div></div></div><div class='card p-3'><h5>Assigned Emergencies</h5><pre id='assignedList' class='bg-light p-3 border rounded mb-0'></pre></div><div class='card p-3 mt-3'><h5>First Aid</h5><div class='row g-2'><div class='col-md-3'><input id='firstAidEmergencyId' class='form-control' placeholder='Emergency ID'></div><div class='col-md-3'><button id='loadQuestions' class='btn btn-secondary w-100'>Questions</button></div><div class='col-md-3'><button id='loadOptions' class='btn btn-secondary w-100'>Options</button></div><div class='col-md-3'><button id='submitFirstAid' class='btn btn-secondary w-100'>Submit First Aid</button></div></div><pre id='firstAidData' class='bg-light p-3 border rounded mt-2 mb-0'></pre></div></main></div><script src='js/api.js'></script><script src='js/websocket.js'></script><script src='js/driver.js'></script></body></html>
